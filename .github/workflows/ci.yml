name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run lint:copy
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
